
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: e_invoice
      DB_USERNAME: e_invoice
      DB_PASSWORD: secret
      SESSION_DRIVER: file
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
        if [ ! -f .env ]; then cp .env.example .env; fi;
        composer install;
        if ! grep -q "^APP_KEY=base64:" .env; then
          php artisan key:generate --force --no-interaction;
        fi;
        php artisan config:clear;
        php artisan migrate --force;
        php artisan db:seed --force;
        php artisan serve --host=0.0.0.0 --port=8000
      '

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: e_invoice
      POSTGRES_USER: e_invoice
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_invoice -d e_invoice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
